notes:
  - "Revision of serinales_vs_pichiales. Babjeviella inositovora is an outgroup here (it carries only 23.3% of the original 2,995 IN candidates, so it sits outside the rest of Serinales). Dropped for low added information: Candida dubliniensis, C. tropicalis, Suhomyces tanzawaensis, Hyphopichia burtonii (IN); Eremothecium gossypii, Ogataea parapolymorpha, Eeniella nana (OUT). 13 IN and 13 OUT species."
