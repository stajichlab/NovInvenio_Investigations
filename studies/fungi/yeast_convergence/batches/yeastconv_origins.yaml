  "Cladophialophora carrionii": {taxon_group: Chaetothyriales, growth_form: dimorphic, dominant_phase: hyphal}
  "Fonsecaea pedrosoi":         {taxon_group: Chaetothyriales, growth_form: dimorphic, dominant_phase: hyphal}
  # Dothideales origin
