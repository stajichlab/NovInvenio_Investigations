# HYPOTHESIS (Nagy et al. 2014, Nat Commun 5:4471, re-tested): yeast-dominant
# growth arose independently in several fungal lineages by re-deploying an old,
# shared cell-separation toolkit through regulatory change (Zn2Cys6 / Zn-cluster
# TF expansion), accompanied by convergent loss of hyphal and plant-cell-wall
# genes.
#
# DESIGN: one independent pairwise study per yeast origin. Each study is the
# yeast (or yeast-dominant) clade as IN against its closest FILAMENTOUS sister
# lineage as OUT, not a broad Dikarya panel, so a loss call means "lost on the
# way to yeast" rather than "absent from a distant reference". Convergence is
# tested post-hoc across studies (bin/convergence_compare.py), against the
# reversal studies (yeastconv_reversals.yaml) and the matched pseudo-origin
# controls (yeastconv_pseudo_origins.yaml). Same logic as the salt_*.yaml
# replicates in NovInvenio/configs/batches/README.md, framework step 4.
#
# FORMAT: compatible with NovInvenio bin/build_targeted_configs.py (keys
# batch / outgroup_pools / studies[focal, ingroup_extra, outgroup_pool]).
# Every study uses mode: explicit, because the contrast is chosen by growth
# form and phylogeny together, which nearest/trait modes cannot express.
# Extra keys used only by this folder's bin/yc_batches.py (ignored by the
# NovInvenio renderer): study `id`, `origin`, `contrast`, `notes`, and the
# top-level `species` map (TaxonGroup + growth_form per species).
#
# growth_form uses config_support/traits/trait_definitions.yaml
# cell_morphology values (yeast / filamentous / dimorphic). A dimorphic species
# also carries dominant_phase (yeast / hyphal): the phase of its main
# vegetative or parasitic stage in nature. This is the 3-state coding
# (filamentous / dimorphic / predominantly yeast) that Nagy et al. collapsed
# into "can grow as yeast"; it separates gaining the capacity from making the
# yeast phase dominant. Codings come from general mycological knowledge and
# Nagy et al. 2014 Supp. Table 2 where species overlap. They are NOT yet in
# config_support/traits/ and need a source per row before they go there
# (CLAUDE.md provenance rule). `bin/yc_batches.py check` lists every
# disagreement with the curated traits.csv; as of 2026-10-22 those are
# Yarrowia lipolytica (traits.csv: yeast, a genus-level FUNGuild call; here
# dimorphic, since its yeast-to-hypha switch is the system where Znc1 and
# Mhy1 were characterised, Nagy et al. refs 21-22).
#
# STATUS: draft, not rendered against config_support/master_pool.csv (that
# file lives on the cluster). Run `bin/yc_batches.py check --master-pool ...`
# there before any NovInvenio render.

batch: yeastconv_origins

outgroup_pools:
  pezizomycotina_filamentous_v1:
    members:
      - "Arthrobotrys megalospora"   # Orbiliomycetes, earliest Pezizomycotina split
      - "Tuber melanosporum"         # Pezizomycetes
      - "Neurospora crassa"
      - "Aspergillus nidulans"
  taphrino_sister_v1:
    members:
      - "Neolecta irregularis"       # the only filamentous / fruiting Taphrinomycotina
      - "Arthrobotrys megalospora"
      - "Neurospora crassa"
  chaetothyriales_hyphal_v1:
    members:
      - "Capronia coronata"
      - "Cladophialophora carrionii"
      - "Fonsecaea pedrosoi"
  dothideomycetes_filamentous_v1:
    members:
      - "Botryosphaeria dothidea"
      - "Parastagonospora nodorum"
      - "Alternaria alternata"
  capnodiales_filamentous_v1:
    members:
      - "Pseudocercospora fijiensis"
      - "Dothistroma septosporum"
      - "Cladosporium cladosporioides"
  agaricomycotina_filamentous_v1:
    members:
      - "Dacryopinax primogenitus"   # Dacrymycetes
      - "Calocera cornea"            # Dacrymycetes
      - "Coprinopsis cinerea"
  ustilaginales_hyphal_v1:
    members:
      - "Mycosarcoma maydis"         # dimorphic, hyphal parasitic phase dominant
      - "Sporisorium reilianum"
      - "Ustilago hordei"
      - "Ceraceosorus bombacis"      # filamentous Exobasidiomycetes
  pucciniomycotina_filamentous_v1:
    members:
      - "Microbotryum lychnidis-dioicae"   # same class as the red yeasts; hypha-dominant smut
      - "Puccinia graminis"
      - "Melampsora larici-populina"
  mucorales_filamentous_v1:
    members:
      - "Phycomyces blakesleeanus"
      - "Rhizopus delemar"
      - "Lichtheimia corymbifera"
      - "Absidia glauca"

studies:
  - id: yc_saccharomycotina
    split_rank: subphylum
    origin: Saccharomycotina
    contrast: yeast_vs_filamentous_sister
    focal: Saccharomyces cerevisiae
    ingroup_extra:
      mode: explicit
      members:
        - "Lipomyces starkeyi"        # earliest-diverging budding-yeast lineage
        - "Yarrowia lipolytica"
        - "Komagataella phaffii"
        - "Candida albicans"
      reason: >-
        Spans the Saccharomycotina root (Lipomyces) to the CUG clade, so a
        candidate must be present across the subphylum, not one family.
    outgroup_pool: pezizomycotina_filamentous_v1

  - id: yc_taphrinomycotina
    split_rank: subphylum
    origin: Taphrinomycotina
    contrast: yeast_vs_filamentous_sister
    focal: Schizosaccharomyces pombe
    ingroup_extra:
      mode: explicit
      members:
        - "Schizosaccharomyces octosporus"   # local copy in 1KFG_samples.csv
        - "Schizosaccharomyces japonicus"
        - "Saitoella complicata"
        - "Taphrina deformans"
        - "Protomyces inouyei"               # local copy in 1KFG_samples.csv
      reason: >-
        Four yeast-form Taphrinomycotina genera (three Schizosaccharomyces
        species span the genus); Neolecta (the clade's filamentous member) is
        the sister-lineage outgroup.
    outgroup_pool: taphrino_sister_v1
    notes: >-
      Neolecta is nested inside Taphrinomycotina, so it is either the
      ancestral (filamentous) state or a reversal. yc_rev_neolecta runs the
      mirror contrast to tell these apart.

  - id: yc_chaetothyriales
    split_rank: family
    origin: Chaetothyriales black yeasts
    contrast: yeast_dominant_vs_hyphal_dominant
    focal: Exophiala dermatitidis
    ingroup_extra:
      mode: explicit
      members:
        - "Exophiala spinifera"
        - "Exophiala phaeomuriformis"   # sister of E. dermatitidis
        - "Exophiala oligosperma"
        - "Exophiala mesophila"
      reason: >-
        Yeast-dominant Exophiala against hypha-dominant Herpotrichiellaceae
        from the same order; the lab's Chaetothyriales_samples.csv has many
        more genomes if this needs widening.
    outgroup_pool: chaetothyriales_hyphal_v1
    notes: >-
      FUNGuild codes the whole family as dimorphic (traits.csv rows for
      Capronia, Cladophialophora, Fonsecaea, Exophiala), so this is a
      dominance contrast like yc_ustilaginomycotina, not yeast vs filament.

  - id: yc_dothideales
    split_rank: order
    origin: Dothideales (Aureobasidium)
    contrast: yeast_vs_filamentous_sister
    focal: Aureobasidium pullulans
    ingroup_extra:
      mode: explicit
      members:
        - "Aureobasidium melanogenum"
        - "Aureobasidium namibiae"
        - "Aureobasidium subglaciale"
      reason: >-
        Yeast-like Aureobasidium against filamentous Dothideomycetes from
        neighbouring orders.
    outgroup_pool: dothideomycetes_filamentous_v1

  - id: yc_capnodiales
    split_rank: family
    origin: Capnodiales (Hortaea)
    contrast: yeast_vs_filamentous_sister
    focal: Hortaea werneckii
    ingroup_extra:
      mode: explicit
      members:
        - "Hortaea thailandica"
      reason: >-
        Hortaea is a separate origin from Aureobasidium (different order), so
        it is not pooled with it. Only two Hortaea species are known to have
        genomes; no other yeast-dominant Teratosphaeriaceae was found.
    outgroup_pool: capnodiales_filamentous_v1
    notes: >-
      Hortaea is also a halotolerance focal (NovInvenio salt_hortaea.yaml);
      overlap with that study's candidates is a confound to report.

  - id: yc_tremellomycetes
    split_rank: class
    origin: Tremellomycetes
    contrast: yeast_vs_filamentous_sister
    focal: Cryptococcus neoformans
    ingroup_extra:
      mode: explicit
      members:
        - "Kwoniella mangroviensis"
        - "Trichosporon asahii"
        - "Tremella mesenterica"     # dimorphic: yeast phase + jelly basidiocarp
      reason: >-
        Three orders of Tremellomycetes; Dacrymycetes (filamentous, jelly
        fungi) is the nearest non-yeast Agaricomycotina outgroup.
    outgroup_pool: agaricomycotina_filamentous_v1

  - id: yc_ustilaginomycotina
    split_rank: class
    origin: Ustilaginomycotina
    contrast: yeast_dominant_vs_hyphal_dominant
    focal: Malassezia globosa
    ingroup_extra:
      mode: explicit
      members:
        - "Malassezia sympodialis"
        - "Moesziomyces aphidis"      # Pseudozyma: no known hyphal phase
        - "Kalmanozyma brasiliensis"
      reason: >-
        Yeast-only Malassezia and anamorphic Pseudozyma-type yeasts against
        smuts whose dominant phase is the dikaryotic hypha.
    outgroup_pool: ustilaginales_hyphal_v1
    notes: >-
      This is the only origin where the outgroup is itself dimorphic, so it
      tests capacity-vs-dominance (the 3-state coding), not yeast vs
      filament. Moesziomyces/Kalmanozyma sit inside Ustilaginaceae; expect
      few novelties and read the losses.

  - id: yc_pucciniomycotina
    split_rank: class
    origin: Pucciniomycotina (red yeasts)
    contrast: yeast_vs_filamentous_sister
    focal: Rhodotorula toruloides
    ingroup_extra:
      mode: explicit
      members:
        - "Rhodotorula mucilaginosa"
        - "Rhodotorula graminis"          # local copy in 1KFG_samples.csv
        - "Sporobolomyces roseus"
        - "Leucosporidium creatinivorum"
      reason: >-
        Sporidiobolales and Leucosporidiales red yeasts against hypha-dominant
        Pucciniomycotina.
    outgroup_pool: pucciniomycotina_filamentous_v1
    notes: >-
      Rusts are obligate biotrophs with their own large gene losses, so
      novelties in the yeasts are inflated here. Read losses-in-yeast with
      the pseudo-origin controls in mind.

  - id: yc_mucoromycota
    split_rank: family
    origin: Mucorales (dimorphic Mucor)
    contrast: dimorphic_vs_filamentous_sister
    focal: Mucor circinelloides
    ingroup_extra:
      mode: explicit
      members:
        - "Mucor racemosus"
        - "Thamnidium elegans"      # predicted dimorphic in Tahiri et al. 2026 (Nat Commun 17:2148), not tested
      reason: >-
        Three Mucor species with anaerobic or CO2-induced yeast growth; the
        other Mucorales here have no yeast phase.
    outgroup_pool: mucorales_filamentous_v1
    notes: >-
      The UniProt proteome reused for "Mucor circinelloides" (UP000014254,
      taxon 1220926) is strain CBS 277.49, now usually called Mucor
      lusitanicus, so do not add M. lusitanicus as a fourth species.
      The deepest origin in the set; it anchors whether the toolkit
      predates Dikarya (Nagy et al. placed it at the Mucoromycotina+Dikarya
      node).

