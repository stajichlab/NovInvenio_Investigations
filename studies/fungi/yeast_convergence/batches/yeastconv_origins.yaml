  "Komagataella phaffii":       {taxon_group: Saccharomycotina, growth_form: yeast}
  "Candida albicans":           {taxon_group: Saccharomycotina, growth_form: dimorphic, dominant_phase: yeast}
  "Arthrobotrys megalospora":   {taxon_group: Orbiliomycetes, growth_form: filamentous}
  "Tuber melanosporum":         {taxon_group: Pezizomycetes, growth_form: filamentous}
