  "Neolecta irregularis":       {taxon_group: Taphrinomycotina, growth_form: filamentous}
  # Chaetothyriales origin
  "Exophiala dermatitidis":     {taxon_group: Chaetothyriales, growth_form: dimorphic, dominant_phase: yeast}
  "Exophiala spinifera":        {taxon_group: Chaetothyriales, growth_form: dimorphic, dominant_phase: yeast}
  "Exophiala phaeomuriformis":  {taxon_group: Chaetothyriales, growth_form: dimorphic, dominant_phase: yeast}
  "Exophiala oligosperma":      {taxon_group: Chaetothyriales, growth_form: dimorphic, dominant_phase: yeast}
