# NULL / CONTROL: "pseudo-origins". Filamentous lineages that went through a
# large ecological shift with documented gene loss, but no change in growth
# form. They are run with the same design as the yeast origins (small focal
# clade IN vs its filamentous sister OUT) so their loss and novelty lists are
# directly comparable.
#
# The question they answer: is the convergent LOSS signal reported for yeast
# clades (plant-cell-wall-degrading enzymes, hydrophobins, P450s, GSTs;
# Nagy et al. 2014 Table 1) specific to becoming a yeast, or is it what any
# lineage loses when it stops decaying plant material or becomes a host
# specialist? A Pfam/GO term that recurs across yeast origins AND across
# these controls is scored as "streamlining-generic" by
# bin/convergence_compare.py, not as yeast-associated.
#
# Choice of controls (each matches one confound):
#   - powdery mildew: obligate biotroph, extreme gene loss, filamentous
#   - ectomycorrhizal Agaricales: lost most PCWDE families, filamentous
#   - dermatophytes: small genomes, keratin specialists, filamentous,
#     close to the dimorphic Onygenales but without the yeast phase
#   - arbuscular mycorrhizal fungi (Glomeromycotina): DEEP control, a
#     subphylum-level split like Saccharomycotina vs Pezizomycotina;
#     obligate symbionts with large losses incl. most PCWDE families,
#     coenocytic and filamentous throughout
#   - lichen-forming Lecanoromycetes: DEEP control, class-level split inside
#     Pezizomycotina; filamentous, reduced PCWDE repertoires
#
# The two deep controls exist because the first three are family/order-level
# splits, which give shorter gain/loss lists than the subphylum-level yeast
# origins for reasons of depth alone. `split_rank` (every study) records the
# rank of the IN/OUT split; bin/convergence_compare.py reports, per recurrent
# term, how many controls at class depth or deeper also call it.
#
# Species chosen to avoid reusing any species from the origin runs (item 2 of
# the review: shared outgroups make runs non-independent).
#
# Same format and conventions as yeastconv_origins.yaml (see its header).

batch: yeastconv_pseudo_origins

outgroup_pools:
  leotiomycetes_saprotroph_v1:
    members:
      - "Botrytis cinerea"
      - "Sclerotinia sclerotiorum"
      - "Aspergillus nidulans"
  agaricales_saprotroph_v1:
    members:
      - "Amanita thiersii"        # saprotrophic sister of the ECM Amanita clade
      - "Coprinopsis cinerea"
      - "Agaricus bisporus var. burnettii"
      - "Pleurotus ostreatus"
  eurotiomycetes_saprotroph_v1:
    members:
      - "Aspergillus nidulans"
      - "Talaromyces stipitatus"
  mucoromycota_free_living_v1:
    members:
      - "Umbelopsis vinacea"          # Mucoromycotina (Umbelopsidales)
      - "Umbelopsis ramanniana"       # local copy in 1KFG_samples.csv
      - "Mortierella elongata"        # Mortierellomycotina
      - "Lobosporangium transversale" # Mortierellomycotina
  pezizomycotina_nonlichen_v1:
    members:
      - "Penicillium chrysogenum"        # Eurotiomycetes; local copy in 1KFG
      - "Fusarium graminearum"           # Sordariomycetes; local copy in 1KFG
      - "Ascocoryne sarcoides"           # Leotiomycetes; local copy in 1KFG
      - "Pyrenophora tritici-repentis"   # Dothideomycetes; local copy in 1KFG

studies:
  - id: yc_pseudo_powdery_mildew
    split_rank: family
    origin: none (control)
    contrast: pseudo_origin_obligate_biotroph
    focal: Blumeria graminis
    ingroup_extra:
      mode: explicit
      members:
        - "Blumeria hordei"       # 1KFG "Blumeria graminis f_sp_hordei_DH14"
        - "Erysiphe necator"
        - "Podosphaera xanthii"     # replaces G. orontii (no BFD genome); BFD YZU573 (BUSCO 96.6%; P. fusca ZM-2022 was 74%)
      reason: >-
        Three powdery-mildew genera: obligate biotrophs with large documented
        gene-family loss and no yeast phase.
    outgroup_pool: leotiomycetes_saprotroph_v1

  - id: yc_pseudo_ectomycorrhizal
    split_rank: family
    origin: none (control)
    contrast: pseudo_origin_pcwde_loss
    focal: Laccaria bicolor
    ingroup_extra:
      mode: explicit
      members:
        - "Laccaria amethystina"
        - "Hebeloma cylindrosporum"
        - "Amanita muscaria"
      reason: >-
        Three independent ectomycorrhizal Agaricales lineages; all lost most
        plant-cell-wall-degrading families but stay filamentous.
    outgroup_pool: agaricales_saprotroph_v1

  - id: yc_pseudo_dermatophyte
    split_rank: order
    origin: none (control)
    contrast: pseudo_origin_host_specialist
    focal: Trichophyton rubrum
    ingroup_extra:
      mode: explicit
      members:
        - "Microsporum canis"        # strain BMU_08102 (BUSCO 96.6%); BMU_08359 scored 60.4%
        - "Trichophyton interdigitale"
        - "Nannizzia gypsea"
      reason: >-
        Filamentous keratinophilic host specialists with compact genomes.
    outgroup_pool: eurotiomycetes_saprotroph_v1

  - id: yc_pseudo_arbuscular_mycorrhizal
    split_rank: subphylum
    origin: none (control)
    contrast: pseudo_origin_obligate_symbiont_deep
    focal: Rhizophagus irregularis      # local copy in 1KFG_samples.csv
    ingroup_extra:
      mode: explicit
      members:
        - "Gigaspora rosea"
        - "Diversispora epigaea"
        - "Geosiphon pyriformis"
      reason: >-
        Three Glomeromycotina orders plus Geosiphon (cyanobacterial symbiont);
        obligate biotrophs with documented loss of plant-cell-wall-degrading
        enzymes and fatty-acid synthase, never with a yeast phase.
    outgroup_pool: mucoromycota_free_living_v1
    notes: >-
      Glomeromycotina is sister to Mucoromycotina + Mortierellomycotina, so
      this is the depth of the Saccharomycotina origin and deeper than the
      Mucor origin. AMF assemblies are large and repeat-rich; check BUSCO
      before reading losses.

  - id: yc_pseudo_lichen
    split_rank: class
    origin: none (control)
    contrast: pseudo_origin_lichen_deep
    focal: Cladonia rubrotincta           # BFD annotation (replaces C. grayi, N50 16 kb)
    ingroup_extra:
      mode: explicit
      members:
        - "Xanthoria parietina"          # local copy in 1KFG_samples.csv
        - "Umbilicaria pustulata"
        - "Letharia lupina"
      reason: >-
        Four Lecanoromycetes lichen mycobionts from three orders, against one
        non-lichen species from each of four other Pezizomycotina classes.
    outgroup_pool: pezizomycotina_nonlichen_v1
    notes: >-
      Use mycobiont-only assemblies (cultured, or with photobiont and
      bacterial contigs removed); a metagenome-derived proteome would add
      algal and bacterial "novelties".

