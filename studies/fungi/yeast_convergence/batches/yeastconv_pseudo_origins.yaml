  "Agaricus bisporus var. burnettii": {taxon_group: Agaricales, growth_form: filamentous}
  "Pleurotus ostreatus":              {taxon_group: Agaricales, growth_form: filamentous}
  "Trichophyton rubrum":              {taxon_group: Onygenales, growth_form: filamentous}
