  python_path: /bigdata/stajichlab/jstajich/projects/NovInvenio_Investigations/.pixi/envs/default/bin/python3
  packages:
    scipy: 1.18.1
    numpy: 2.5.2
    pandas: 3.0.3
    matplotlib: 3.11.2
  mmseqs_version: 18.8cc5c
  mmseqs_parameters: easy-search -e 1e-5 -c 0.5 --cov-mode 0 (query and target coverage >= 0.5), default
    -s 5.7, default --max-seqs 300, --threads 32; searches af_vs_v5, v5_vs_af, af_vs_v2, v2_vs_af of tier1_rep_seq.fasta
  best_hit_rule: highest bits per query; ties by lower evalue then target id
  rbh_rule: best(Af family) = C and best(C) = Af family
  slurm_job_ids:
  - 30041523
definitions:
  A: pipeline island test recomputed from pfam.domtblout (hmmscan --domE 1e-3, i-Evalue <= 1e-3, shell+cloud
    representatives), one-sided Fisher, BH over terms in >= 1 island family; counts match island_pfam_enrichment.tsv
    exactly; clan level new
  B: bin/pangenome_gain_loss_enrichment.py outputs (hypergeometric, BH per test set and vocab, K >= 5),
    scopes shell_soft_core and all_accessory, gain and loss, Pfam and clan
  C: 'new: hypergeometric one-sided, BH, K >= 5; accessory (soft_core+shell+cloud+singleton) vs universe
    core+soft_core+shell+cloud+singleton families with >= 1 Pfam (cut_ga); shell+cloud vs universe core+shell+cloud
    with >= 1 Pfam'
  tiers: '1: q<0.05 in Af, v5 and v2; 2: q<0.05 in Af and exactly one of v5/v2; 3: p<0.05 in all three
    and not tier 1/2; only terms tested in >= 2 runs'
license: derived from NII pangenome outputs; Pfam 38.2 annotation (CC0)
