  scripts:
  - scripts/run_mmseqs_search.sbatch
  - scripts/xsp_domains.py
  - scripts/xsp_families.py
  - scripts/xsp_figures.py
  - scripts/xsp_summary.py
  - scripts/write_provenance.py
  commands:
  - 'sbatch scripts/run_mmseqs_search.sbatch  # SLURM job 30041523, partition stajichlab, milan'
