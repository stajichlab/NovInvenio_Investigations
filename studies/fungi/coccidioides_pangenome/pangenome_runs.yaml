# pangenome.nf runs for coccidioides_pangenome, launched with `bin/ni pangenome run`.
# Spec: notes/superpowers/specs/2026-09-26-ni-pangenome-mode-design.md
# New runs only. The published rescue_freqpol_* runs (pipeline 91e3157) predate ni.
# pipeline_commit: NovInvenio v0.7.0 main (a394ace, 2026-09-28) with the island locus view,
# DNA check and clinker panel.
defaults:
  pipeline_commit: a394ace8d288b19591ea148e5a12d55aeac668b1
  pfam_hmm: /bigdata/stajichlab/jstajich/projects/NovInvenio/db/pfam/Pfam-A.hmm
  queue_config: stajichlab_queue.config
  head_job: {partition: exfab, account: exfab, time: 30-00:00:00, mem: 8G, cpus: 1}
  params:
    pangenome_cluster_backend: mmseqs
    pangenome_rescue_enable: true
runs:
  immitis_in_posadasii_out_v2:
    samplesheet: config_immitis_in_posadasii_out.csv
    species_tree: analysis/species_tree/coccidioides_coccidioides_only.full.nwk
    publish: true
    current: true
  posadasii_in_immitis_out_v2:
    samplesheet: config_posadasii_in_immitis_out.csv
    species_tree: analysis/species_tree/coccidioides_coccidioides_only.full.nwk
    publish: true
  immitis_only_v2:
    samplesheet: config_immitis.csv
    publish: true
  posadasii_only_v2:
    samplesheet: config_posadasii.csv
    publish: true
