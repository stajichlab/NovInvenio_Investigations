# pangenome.nf runs for Afumigatus_pangenome, launched with `bin/ni pangenome run`.
# Spec: notes/superpowers/specs/2026-09-26-ni-pangenome-mode-design.md
# 293 A. fumigatus strains (IN) + 2 UniProt reference outgroups (OUT). The old
# run_pangenome.sh rewrote the outgroups' GFF3 protein_id to the UniProt FASTA
# IDs; NovInvenio #187 (GN=/locus_tag fallback in GENE_POSITIONS, in v0.7.0)
# should make that unnecessary -- check the outgroups' gene_positions after the run.
defaults:
  pipeline_commit: a394ace8d288b19591ea148e5a12d55aeac668b1
  pfam_hmm: /bigdata/stajichlab/jstajich/projects/NovInvenio/db/pfam/Pfam-A.hmm
  queue_config: stajichlab_queue.config
  head_job: {partition: exfab, account: exfab, time: 30-00:00:00, mem: 8G, cpus: 1}
  params:
    pangenome_cluster_backend: mmseqs
    pangenome_rescue_enable: true
runs:
  full_v070:                 # failed at ISLAND_LOCI (NovInvenio #213); cache carried into full_v071
    samplesheet: config.csv
    publish: true
  full_v071:                 # d23dc94+ (#212, #213, #214, #215); resumes full_v070's cache
    samplesheet: config.csv
    pipeline_commit: 3b045c684169ca08a3e383ad55030fe87110ab87
    publish: false             # baseline for the v072 comparison; not published
  full_v072:                 # 05fcf3a (#228 reps-only pair evidence, #229 shared columns, #230 permutation_q, #231 variable_gap); resumes full_v071's cache
    samplesheet: config.csv
    pipeline_commit: 05fcf3abbd0b5156e1f5b84c11f6fc5ab173891e
    publish: true
    current: true
    locus_summary_dir: analysis/locus_summary/fig
    starship_overlap_dir: analysis/starship_island_overlap/full_v072
    starship_sm_dir: analysis/starship_island_overlap/full_v072_antismash
    params:
      pangenome_island_reference_strains: Asfu_Af293,Asfu_A1163
  full_v073:                 # same pipeline commit as v072 (05fcf3a); only the viewer sizes change: 500 loci (500 candidates scored) and 500 islands drawn. Reuses v072's cache (incl. the 295 TBLASTN tasks).
    samplesheet: config.csv
    pipeline_commit: 05fcf3abbd0b5156e1f5b84c11f6fc5ab173891e
    publish: true
    params:
      pangenome_island_reference_strains: Asfu_Af293,Asfu_A1163
      pangenome_top_loci: 500
      pangenome_locus_candidates: 500
      pangenome_viz_top_islands: 500
