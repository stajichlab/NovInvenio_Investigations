# Provenance for this study's data_dir/ (symlinks into the primary NovInvenio
# checkout's data/agaricomycetes_v1/, built there via the `ncbi_datasets` CLI,
# 2026-09-10). Unlike pezizo_set1/mushrooms_tremella (UniProt-sourced proteomes,
# fetch_uniprot_proteome.py provenance), every proteome/genome/GFF3 here is NCBI
# RefSeq-sourced -- protein/DNA/GFF3 always from the same assembly per species.
#
# UniProt_Proteome_ID in species.csv (where non-empty) is a separate, additional
# cross-reference used only by the pipeline's optional UniProtDatGz annotation
# lookup (NovInvenio issue #92) -- not this data's source.
- short: Scom
  organism: Schizophyllum commune (strain H4-8 / FGSC 9210)
  taxon_id: '578458'
  assembly: GCF_000143185.2 (Schco3)
  source: NCBI Datasets (ncbi_datasets CLI, module ncbi_datasets/18.30.1)
  access_date: '2026-09-10'
  note: No UniProt reference proteome exists for this species (checked live
    against rest.uniprot.org/uniparc 2026-09-10 -- its only UniParc entry is
    non-reference, unassembled-WGS-based, and unindexed by UniProtKB search).
