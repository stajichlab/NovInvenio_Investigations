[workspace]
authors = ["Jason Stajich <jason.stajich@ucr.edu>"]
channels = ["conda-forge", "bioconda"]
name = "NovInvenio_Investigations"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
# Study-local suites (e.g. studies/fungi/Afumigatus_pangenome/tests/) are part
# of the standard run -- keep `studies/` here so a new study's tests are never
# left as an unlisted directory.
test = "pytest tests/ studies/ -v"
test-pangenome = "pytest studies/fungi/Afumigatus_pangenome/tests/ -v"

[dependencies]
python = "3.12.*"
pandas = ">=2.2,<3"
biopython = ">=1.84,<2"
pyyaml = ">=6.0.3,<7"
goatools = ">=1.4,<2"
scipy = ">=1.14,<2"
numpy = ">=1.26,<3"
duckdb = ">=1.1,<2"
ncbi-datasets-cli = ">=18,<19"
pytest = ">=8.0,<9"
nextflow = ">=25,<26"
mmseqs2 = ">=18.8cc5c,<19"
diamond = ">=2.2.0,<3"
hmmer = ">=3.4,<4"
blast = ">=2.17.0,<3"
mash = ">=2.3,<3"
parsnp = ">=2.1,<3"
zstd = ">=1.5,<2"
matplotlib = ">=3.9,<4"
