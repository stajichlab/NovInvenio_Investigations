[workspace]
authors = ["Jason Stajich <jason.stajich@ucr.edu>"]
channels = ["conda-forge", "bioconda"]
name = "NovInvenio_Investigations"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
test = "pytest tests/ -v"

[dependencies]
python = "3.12.*"
pandas = ">=2.2,<3"
biopython = ">=1.84,<2"
pyyaml = ">=6.0.3,<7"
goatools = ">=1.4,<2"
scipy = ">=1.14,<2"
duckdb = ">=1.1,<2"
ncbi-datasets-cli = ">=18,<19"
pytest = ">=8.0,<9"
nextflow = ">=25,<26"
